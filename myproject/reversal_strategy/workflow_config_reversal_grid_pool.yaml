qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn

market: &market csi300
benchmark: &benchmark SH000300

# 反转网格股票池策略配置
port_analysis_config: &port_analysis_config
    executor:
        class: SimulatorExecutor
        module_path: qlib.backtest.executor
        kwargs:
            time_per_step: day
            generate_portfolio_metrics: true
            verbose: false  # 禁用进度条，方便日志重定向
    strategy:
        class: ReversalGridPoolStrategy
        module_path: reversal_strategy.reversal_grid_pool_strategy
        kwargs:
            max_holding_stocks: 20  # 最多同时持仓20只股票
            # 股票池配置：每只股票有独立的参数
            # 激进优化：放宽长期趋势限制、大幅降低开仓门槛、提高初始仓位
            stock_pool:
                # 浦发银行
                SH600000:
                    max_position_value: 5000000
                    long_trend_period: 12
                    short_trend_period: 3
                    long_trend_atr_threshold: 0.1
                    short_trend_atr_threshold: 0.1
                    atr_period: 14
                    atr_multiplier: 2.0
                    grid_atr_interval: 0.5
                    entry_atr_multiplier: 0.45
                    lookback_period: 10
                    grid_size: 0.25
                    initial_position_ratio: 0.95
                    profit_atr_multiplier: 0.5
                    enable_short: false
                
                # 中国平安
                SH601318:
                    max_position_value: 5000000
                    long_trend_period: 12
                    short_trend_period: 3
                    long_trend_atr_threshold: 0.15
                    short_trend_atr_threshold: 0.15
                    atr_period: 14
                    atr_multiplier: 2.0  # 降低止损距离，更及时止损
                    grid_atr_interval: 0.5
                    entry_atr_multiplier: 0.5
                    lookback_period: 10
                    grid_size: 0.25
                    initial_position_ratio: 0.9
                    enable_short: false
                
                # 贵州茅台
                SH600519:
                    max_position_value: 5000000  # 统一调整为1000万，让10只股票基本用满资金
                    long_trend_period: 15
                    short_trend_period: 5
                    long_trend_atr_threshold: 0.17
                    short_trend_atr_threshold: 0.17
                    atr_period: 14
                    atr_multiplier: 2.2  # 降低止损距离，更及时止损
                    grid_atr_interval: 0.6
                    entry_atr_multiplier: 0.7  # 优化：降低开仓门槛，增加机会
                    lookback_period: 10
                    grid_size: 0.25
                    initial_position_ratio: 0.85  # 优化：提高初始仓位
